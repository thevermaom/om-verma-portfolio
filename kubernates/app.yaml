apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: om                   # deploy into the "om" namespace
spec:
  replicas: 3                     # keep 3 pods running
  selector:
    matchLabels:
      app: web
  template:                       # pod blueprint
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:         # only send traffic when nginx answers
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: om                   # same namespace as the Deployment
spec:
  type: NodePort
  selector:
    app: web                      # send traffic to pods labelled app=web
  ports:
    - port: 80                    # service port inside the cluster
      targetPort: 80              # container port
      nodePort: 30080             # opened on the nodes -> mapped to your laptop
