kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane        # the brain
    extraPortMappings:
      - containerPort: 30080   # port inside the cluster...
        hostPort: 30080        # ...opened on your laptop as localhost:30080
  - role: worker               # node 1
  - role: worker               # node 2
