# Opens the website to the browser: localhost:30080 -> web pods (05) on port 8000
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: om
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080             # mapped to the laptop in ../kind-config.yaml
