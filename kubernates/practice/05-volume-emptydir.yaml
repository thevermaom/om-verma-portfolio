# VOLUME 1: emptyDir = a temporary shared folder that lives as long as the POD.
# Two containers in ONE pod share it: "writer" writes, "reader" reads.
#   volumes:       WHAT the storage is   (name: shared, type emptyDir)
#   volumeMounts:  WHERE it appears       (/shared inside each container)
# The "name" connects them. Pod deleted → folder is gone.
# Used for: scratch space, cache, sharing files between containers (your Loki uses one).
apiVersion: v1
kind: Pod
metadata:
  name: volume-emptydir
  namespace: practice
spec:
  volumes:
    - name: shared                 # ← name...
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date +%T) written by writer\" >> /shared/log.txt; sleep 5; done"]
      volumeMounts:
        - name: shared             # ← ...must match
          mountPath: /shared
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits:   { memory: 32Mi }
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "touch /shared/log.txt; tail -f /shared/log.txt"]
      volumeMounts:
        - name: shared
          mountPath: /shared
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits:   { memory: 32Mi }
