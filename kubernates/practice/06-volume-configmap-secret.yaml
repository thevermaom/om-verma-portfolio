# VOLUME 2: ConfigMap and Secret mounted as FILES.
# Each key becomes one file inside the folder:
#   ConfigMap key "greeting.txt"  →  /etc/app/greeting.txt
#   Secret    key "password"      →  /etc/secret/password
# Used for: config files (your Prometheus, Grafana, Loki, Alloy configs come in this way).
# Bonus: edit the ConfigMap → the FILE updates by itself in ~1 minute (env variables don't).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
  namespace: practice
data:
  greeting.txt: "Hello from a ConfigMap!"
  settings.yaml: |
    color: blue
    max_students: 100
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
  namespace: practice
type: Opaque
stringData:
  password: practice-only-not-real
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-config
  namespace: practice
spec:
  volumes:
    - name: settings
      configMap:
        name: app-settings
    - name: secret
      secret:
        secretName: demo-secret
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date +%T) greeting = $(cat /etc/app/greeting.txt)\"; sleep 10; done"]
      volumeMounts:
        - name: settings
          mountPath: /etc/app
          readOnly: true
        - name: secret
          mountPath: /etc/secret
          readOnly: true
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits:   { memory: 32Mi }
